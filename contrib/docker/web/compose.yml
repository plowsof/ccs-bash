# The web server's side in Docker (docs/docker.md, "The web server in Docker"):
#   - the gate (ccs-receive) behind its own sshd on port 2223, and the gate's heartbeat;
#   - for the backup machine, the backup receiver (ccs-backup-receive) behind another sshd on
#     2224. The "backup" profile; run it on its own machine, not the web server, whose root could
#     rewrite every copy. A test setup may run both on one (COMPOSE_PROFILES=backup);
#   - the site: www (Caddy, HTTPS, its own certificates) and tor (the onion), serving what the
#     gate let into /var/lib/ccs-data (docs/two-machines.md).
# The image is used by ID, never pulled (container/gate.Dockerfile, attested with ccs-bash).
# Folders, users and key files are the host's (docs/two-machines.md, docs/setup.md).
# Settings: .env (see env.example).
#
#   docker compose --profile init run --rm -T init     once: the host key, passwd (and after an upgrade)
#   docker compose up -d                               start
#   journalctl -t ccs-web -f                           sshd's, Caddy's and Tor's lines (the gate's own are in /var/log/ccs-web/)

x-hardened: &hardened
  image: ${CCS_GATE_IMAGE:?the attested ccs-gate image ID}
  pull_policy: never
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  init: true
  # The host's network, so sshd sees the backend's real address, which authorized_keys' from=
  # checks. (Published ports would show Docker's address for IPv6.) www and tor have their own, below.
  network_mode: host
  logging:
    driver: journald
    options:
      tag: ccs-web

# sshd runs as root and needs only these capabilities (tested: without any one, no login gets
# past pre-authentication):
#   SETUID, SETGID: to become its sshd user for pre-authentication, then ccs-data or ccs-backup
#                   for the forced command (setresuid, setgroups)
#   SYS_CHROOT:     pre-authentication is chrooted in /var/empty
# Not DAC_OVERRIDE (what it reads is root's), not NET_BIND_SERVICE (ports are over 1024), not
# KILL (its children end on their own).
x-sshd-caps: &sshd-caps [SETUID, SETGID, SYS_CHROOT]

x-health: &health
  interval: 5m
  timeout: 10s
  retries: 2
  start_period: 30s

services:
  # Run once as root, and after each upgrade: sshd's host key (first time only), passwd and group
  init:
    <<: *hardened
    network_mode: none
    restart: "no"
    user: "0:0"
    entrypoint: ["/usr/local/bin/ccs-web-init"]
    environment:
      CCS_DATA_UID: ${CCS_DATA_UID:?id -u ccs-data:id -g ccs-data}
      CCS_BACKUP_UID: ${CCS_BACKUP_UID:?id -u ccs-backup:id -g ccs-backup}
    volumes:
      - ${CCS_SSH_DIR:-/etc/ccs-gate/ssh}:/etc/ccs-ssh/keys
    profiles: [init]

  # The gate: the push account, ccs-data, may run only ccs-receive
  gate:
    <<: *hardened
    user: "0:0"
    cap_add: *sshd-caps
    # One push is checked at a time (the gate's lock); its decoders are capped at 1 GB each too
    mem_limit: 2g
    pids_limit: 256
    command: ["-p", "${CCS_GATE_PORT:-2223}", "-o", "AllowUsers=ccs-data", "-o", "ForceCommand=/usr/local/bin/ccs-receive"]
    healthcheck: {<<: *health, test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/${CCS_GATE_PORT:-2223}"]}
    volumes:
      # sshd's host key, passwd and group (init writes them), read-only here; the key files,
      # root-owned, outside any home: the host's, with their from= and command=
      - ${CCS_SSH_DIR:-/etc/ccs-gate/ssh}:/etc/ccs-ssh/keys:ro
      - ${CCS_AUTHORIZED_KEYS:-/etc/ssh/authorized_keys}:/etc/ccs-ssh/authorized_keys:ro
      - /etc/ccs-gate:/etc/ccs-gate:ro
      - /var/lib/ccs-staging:/var/lib/ccs-staging
      - /var/lib/ccs-data:/var/lib/ccs-data
      - /var/lib/ccs-gate:/var/lib/ccs-gate
      # The gate's log, /var/log/ccs-gate.log in here. A folder, since a mounted file would stay the old one after rotation.
      - ${CCS_WEB_LOG:-/var/log/ccs-web}:/var/log

  # The backup receiver: the backup account, ccs-backup, may run only ccs-backup-receive.
  # On its own machine run "docker compose --profile backup up -d backup", with its own .env
  # (the image, CCS_BACKUP_UID). The gate and heartbeat are not started there.
  backup:
    <<: *hardened
    profiles: [backup]
    user: "0:0"
    cap_add: *sshd-caps
    mem_limit: 256m
    pids_limit: 64
    command: ["-p", "${CCS_BACKUP_PORT:-2224}", "-o", "AllowUsers=ccs-backup", "-o", "ForceCommand=/usr/local/bin/ccs-backup-receive"]
    healthcheck: {<<: *health, test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/${CCS_BACKUP_PORT:-2224}"]}
    volumes:
      # sshd's host key, passwd and group (init writes them), read-only here; the key files,
      # root-owned, outside any home: the host's, with their from= and command=
      - ${CCS_SSH_DIR:-/etc/ccs-gate/ssh}:/etc/ccs-ssh/keys:ro
      - ${CCS_AUTHORIZED_KEYS:-/etc/ssh/authorized_keys}:/etc/ccs-ssh/authorized_keys:ro
      - /etc/ccs-backup:/etc/ccs-backup:ro
      - /var/lib/ccs-backup:/var/lib/ccs-backup
      - ${CCS_WEB_LOG:-/var/log/ccs-web}:/var/log

  # The heartbeat (docs/two-machines.md): every 5 minutes, as ccs-data. Alerts when no push has
  # come for HEARTBEAT_MINUTES (alert.conf).
  heartbeat:
    <<: *hardened
    user: "${CCS_DATA_UID}"
    entrypoint: ["bash", "-c", "while :; do /usr/local/bin/ccs-receive --heartbeat; date +%s > /tmp/beat; sleep 300; done"]
    healthcheck: {<<: *health, test: ["CMD", "bash", "-c", "(( $$(date +%s) - $$(cat /tmp/beat) < 900 ))"]}
    volumes:
      - /etc/ccs-gate:/etc/ccs-gate:ro
      - /var/lib/ccs-gate:/var/lib/ccs-gate
      - ${CCS_WEB_LOG:-/var/log/ccs-web}:/var/log

  # The site: Caddy, as CCS_WWW_UID, serves /var/lib/ccs-data read-only over HTTPS (Caddyfile),
  # with its own certificates (Let's Encrypt, in CCS_WWW_DIR), and to tor through a socket in
  # CCS_WWW_DIR/onion. It has its own network namespace, so ports 80 and 443 are published and it
  # can bind them without a capability (the sysctl applies to that namespace only).
  www:
    <<: *hardened
    network_mode: bridge
    user: "${CCS_WWW_UID:?id -u ccs-www:id -g ccs-www}"
    sysctls: {net.ipv4.ip_unprivileged_port_start: "80"}
    ports: ["80:80", "443:443"]
    mem_limit: 512m
    pids_limit: 256
    entrypoint: ["/usr/bin/caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      CCS_SITE_HOST: ${CCS_SITE_HOST:?the site's host name, ccs.getmonero.org}
      CCS_ONION: ${CCS_ONION:?the site's onion address, <56 characters>.onion (tor's hostname)}
      CCS_ACME_EMAIL: ${CCS_ACME_EMAIL:?an address Let's Encrypt may write to about the certificate}
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp
    healthcheck: {<<: *health, interval: 1m, test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--unix-socket", "/run/ccs-www/onion.sock", "http://onion/"]}
    volumes:
      - /var/lib/ccs-data:/srv:ro
      - ${CCS_WWW_DIR:-/var/lib/ccs-www}/data:/data
      - ${CCS_WWW_DIR:-/var/lib/ccs-www}/onion:/run/ccs-www
      # This machine's other sites, if any (sites/<name>.caddy; otherwise an empty folder)
      - ${CCS_WWW_DIR:-/var/lib/ccs-www}/sites:/etc/ccs-www/sites:ro

  # The onion: Tor, as CCS_TOR_UID, with its keys in CCS_TOR_DIR. The onion address is derived
  # from its key, so keep a copy. Its port 80 goes to www's socket (torrc).
  tor:
    <<: *hardened
    network_mode: bridge
    user: "${CCS_TOR_UID:?id -u ccs-tor:id -g ccs-tor}"
    mem_limit: 512m
    pids_limit: 64
    entrypoint: ["/usr/bin/tor", "-f", "/etc/tor/torrc"]
    healthcheck: {<<: *health, interval: 1m, test: ["CMD", "test", "-s", "/var/lib/tor/ccs/hostname"]}
    volumes:
      - ${CCS_TOR_DIR:-/var/lib/ccs-tor}:/var/lib/tor
      - ${CCS_WWW_DIR:-/var/lib/ccs-www}/onion:/run/ccs-www
