# The backend in Docker (docs/docker.md): the update of docs/handover.md, step 9, as one service
# a stage (contrib/docker/backend/step), each with only its own user, network and folders, and
# monero-wallet-rpc. No service has the Docker socket: they take turns through the run folder.
# The images by ID, never pulled: ccs-bash's and ccs-front-bash's as their releases and ccs-sigs
# attest them, the wallet's as built here (wallet-rpc/Dockerfile). The host's folders are the
# same as the host setup's (docs/setup.md), so either one can run them, never both at once.
# Its settings: .env beside this file (env.example). A host whose monerod listens on its
# 127.0.0.1 only: compose.host.yml as well.
#
#   docker compose up -d          start (after "docker compose --profile init run --rm init" once)
#   journalctl -t ccs -f          every stage's output, in order (ccs log: its errors)
#   docker compose ps             each service's health
#   docker compose down           stop

x-hardened: &hardened
  read_only: true
  # /tmp is memory: sized, as each container's memory and processes are, so that one fed a huge
  # answer (the web server's to the watch, a feed's, the forge's) can't take the machine's memory
  # from monerod and the wallet (each uses tens of MB; the watch's copy of the site, a few)
  tmpfs: ["/tmp:size=256m"]
  mem_limit: 1g
  pids_limit: 256
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  pull_policy: never
  init: true
  # each line to journald, under one name: a run's lines in order, whichever stage said them
  logging:
    driver: journald
    options:
      tag: ccs

x-run: &run
  # the run folder: each stage's "done", "status", "at", pipes, and the push's lock
  type: bind
  source: ${CCS_RUN_DIR:-/var/lib/ccs/run}
  target: /run/ccs

x-health: &health
  interval: 1m
  timeout: 10s
  retries: 3
  start_period: 15m

x-step: &step /opt/ccs-bash/contrib/docker/backend/step

networks:
  # ccs-bash and the wallet, and no way out
  wallet:
    internal: true
  # the wallet's way out: to monerod (wallet-rpc.conf's daemon-address)
  monerod: {}
  # the stages' way out: the forge, the web server, the backup machine
  default: {}

services:
  # once, as root: the run folder, a folder for each stage owned by its user, the push's lock
  init:
    image: ${CCS_BASH_IMAGE:?the attested ccs-bash image ID}
    pull_policy: never
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    user: "0:0"
    entrypoint: [*step, "init"]
    environment:
      CCS_UIDS: "pull=${GIT_UID:?} ccs-bash=${CCS_UID:?} backup=${SEND_UID:?} front=${FRONT_UID:?} push=${PUSH_UID:?} watch=${WATCH_UID:?}"
      CCS_NOW_GID: ${WALLET_UID:?}
      CCS_WATCH_GID: ${WATCH_UID}
    volumes: [*run]
    restart: "no"
    profiles: [init]

  wallet-rpc:
    <<: *hardened
    image: ${WALLET_IMAGE:?the wallet-rpc image ID}
    # (more room: a wallet's cache grows with every payment, and a rescan holds more)
    mem_limit: 4g
    # its RPC on the wallet network only (ccs-bash), its login in wallet-rpc.conf; out to monerod
    networks: [wallet, monerod]
    # a monerod on this machine: daemon-address=host.docker.internal:18089, its restricted RPC
    # listening where containers reach it (docs/handover.md, 1)
    extra_hosts: ["host.docker.internal:host-gateway"]
    user: "${WALLET_UID:?}"
    environment:
      # its shared ring database (~/.shared-ringdb) beside the wallet, the rest is read-only
      HOME: ${WALLET_DIR:-/var/lib/ccs/wallet}
    command: ["--config-file", "/etc/ccs-wallet/wallet-rpc.conf", "--non-interactive",
              "--rpc-bind-ip", "0.0.0.0", "--confirm-external-bind",
              "--tx-notify", "/usr/local/bin/ccs-notify %s"]
    # answering: its RPC port open (bash's /dev/tcp; the image has no curl)
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/${WALLET_PORT:-18082}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - ${WALLET_CONF:-/etc/ccs-wallet/wallet-rpc.conf}:/etc/ccs-wallet/wallet-rpc.conf:ro
      - ${WALLET_DIR:-/var/lib/ccs/wallet}:${WALLET_DIR:-/var/lib/ccs/wallet}
      - *run

  pull:
    <<: *hardened
    image: ${CCS_BASH_IMAGE}
    # out to the forge (the default network: out, nothing in; no egress filter)
    user: "${GIT_UID}"
    entrypoint: [*step, "pull"]
    environment: &every
      HOME: /tmp
      CCS_EVERY: ${CCS_EVERY:-120}
    healthcheck: {<<: *health, test: ["CMD", *step, "health", "pull"]}
    volumes:
      - /var/lib/ccs/proposals:/var/lib/ccs/proposals
      - ${CCS_PULL_OK:-/var/lib/ccs/pull-ok}:/var/lib/ccs/pull-ok
      - *run

  ccs-bash:
    <<: *hardened
    image: ${CCS_BASH_IMAGE}
    # the wallet (ccs.conf's RPC_URL: http://wallet-rpc:18082/json_rpc, its port wallet-rpc.conf's), and out to the forge's API
    networks: [wallet, default]
    user: "${CCS_UID}"
    entrypoint: [*step, "ccs-bash"]
    environment: *every
    healthcheck: {<<: *health, test: ["CMD", *step, "health", "ccs-bash"]}
    depends_on:
      wallet-rpc:
        condition: service_healthy
    volumes:
      - /etc/ccs/ccs.conf:/etc/ccs/ccs.conf:ro
      - /var/lib/ccs/proposals:/var/lib/ccs/proposals:ro
      - /var/lib/ccs/state:/var/lib/ccs/state
      - /var/lib/ccs/out:/var/lib/ccs/out
      - *run

  backup:
    <<: *hardened
    image: ${CCS_BASH_IMAGE}
    # its own user (its key, its sums: no other stage's); out over ssh (no egress filter: any
    # address, like every stage with a way out)
    user: "${SEND_UID}"
    entrypoint: [*step, "backup"]
    environment:
      <<: *every
      CCS_BACKUP: ${CCS_BACKUP:?ccs-backup@<the backup machine>}
      CCS_BACKUP_PORT: ${CCS_BACKUP_PORT:-22}
    healthcheck: {<<: *health, test: ["CMD", *step, "health", "backup"]}
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - /var/lib/ccs/state:/var/lib/ccs/state:ro
      - ${CCS_BACKUP_KEYS:-/etc/ccs/backup}:/etc/ccs/backup:ro
      - *run

  front:
    <<: *hardened
    image: ${CCS_FRONT_IMAGE:?the attested ccs-front-bash image ID}
    network_mode: none
    user: "${FRONT_UID}"
    # the stage runner from ccs-bash's checkout at its attested commit (the image has bash)
    entrypoint: ["/step", "front", "/design/public", "/data", "/proposals", "/www/site", "/subaddresses/subaddresses.txt"]
    environment:
      <<: *every
      # the site's onion address, for the footer's onion line (none: no line); the web server's
      # gate accepts only the one in its own /etc/ccs-gate/onion
      CCS_ONION: ${CCS_ONION:-}
      # the feed's links (feed.xml): the site's address, as the web server's alert.conf SITE_URL
      CCS_SITE_URL: ${CCS_SITE_URL:-}
    healthcheck: {<<: *health, test: ["CMD", "/step", "health", "front"]}
    volumes:
      - ${CCS_BASH_DIR:-/opt/ccs-bash}/contrib/docker/backend/step:/step:ro
      # the folder above the design: an upgrade renames public (public.old, public.new), and
      # a mount of public itself would keep the old one
      - ${CCS_DESIGN_DIR:-/opt/ccs-front-hugo}:/design:ro
      - /var/lib/ccs/out:/data:ro
      - /var/lib/ccs/proposals:/proposals:ro
      - /var/lib/ccs/www:/www
      - /etc/ccs-front:/subaddresses:ro
      - *run

  push:
    <<: *hardened
    image: ${CCS_BASH_IMAGE}
    # its own user (its key, the copy of what was pushed, each run's result); out over ssh
    user: "${PUSH_UID}"
    entrypoint: [*step, "push"]
    environment:
      <<: *every
      CCS_PUSH: ${CCS_PUSH:?ccs-data@<the web server>}
      CCS_PUSH_PORT: ${CCS_PUSH_PORT:-22}
    healthcheck: {<<: *health, test: ["CMD", *step, "health", "push"]}
    volumes:
      - /etc/passwd:/etc/passwd:ro
      # the push key and the web server's host key (id_ed25519, known_hosts; ccs-push, 600)
      - ${CCS_PUSH_KEYS:-/etc/ccs/push}:/etc/ccs/push:ro
      # the folder above the site: ccs-front-bash replaces www/site each run, and a mount of it
      # would keep the one replaced (empty, once deleted)
      - /var/lib/ccs/www:/var/lib/ccs/www:ro
      - /var/lib/ccs/pushed:/var/lib/ccs/pushed
      - *run

  # ccs-watch: after each run, and between pushes at random times (out to the web server, and
  # to alert.conf's ALERT_URL and WATCH_PROXY)
  watch:
    <<: *hardened
    image: ${CCS_BASH_IMAGE}
    # its own user: its state and the results it counts out of the other stages' reach
    user: "${WATCH_UID}"
    # a proxy on this machine (Tor, ssh -D): WATCH_PROXY=socks5h://host.docker.internal:9050
    extra_hosts: ["host.docker.internal:host-gateway"]
    entrypoint: [*step, "watch", "${CCS_SITE_URL:?the site's address, https://...}"]
    environment:
      <<: *every
      CCS_WATCH_STATE: /var/lib/ccs/watch
    healthcheck: {<<: *health, test: ["CMD", *step, "health", "watch"]}
    volumes:
      - ${CCS_ALERT_CONF:-/etc/ccs/alert.conf}:/etc/ccs/alert.conf:ro
      # alert.conf's SUBADDRESSES
      - /etc/ccs-front:/etc/ccs-front:ro
      - /var/lib/ccs/pushed:/var/lib/ccs/pushed:ro
      # forge-ok, read; its own state, written (ccs-watch's)
      - /var/lib/ccs/state:/var/lib/ccs/state:ro
      - ${CCS_WATCH_DIR:-/var/lib/ccs/watch}:/var/lib/ccs/watch
      - ${CCS_PULL_OK:-/var/lib/ccs/pull-ok}:/var/lib/ccs/pull-ok:ro
      - *run
