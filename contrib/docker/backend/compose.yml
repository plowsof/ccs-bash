# The backend in Docker (docs/docker.md). The update loop of docs/handover.md, step 9, runs as
# one service per stage (contrib/docker/backend/step), each with only its own user, network and
# folders, plus monero-wallet-rpc. No service has the Docker socket; they take turns through
# the run folder.
# Images are used by ID and never pulled. ccs-bash's must match its release and ccs-sigs.
# The wallet's is built here (wallet-rpc/Dockerfile).
# Host accounts, folders, config and keys: docs/setup.md.
# Settings: .env beside this file (see env.example). If monerod listens on 127.0.0.1 only,
# add compose.host.yml as well.
#
#   docker compose up -d          start (after "docker compose --profile init run --rm init" once)
#   journalctl -t ccs -f          every stage's output, in order (ccs log shows the errors)
#   docker compose ps             each service's health
#   docker compose down           stop

x-hardened: &hardened
  read_only: true
  # /tmp is memory. It is limited, like each container's memory and processes, so a container
  # fed a huge answer (from the web server, a feed or the forge) can't starve monerod and the
  # wallet. Each stage uses tens of MB; the watch's copy of the site a few.
  tmpfs: ["/tmp:size=256m"]
  mem_limit: 1g
  pids_limit: 256
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  pull_policy: never
  init: true
  # Every line goes to journald under one name, so a run's lines are in order whatever the stage
  logging:
    driver: journald
    options:
      tag: ccs

x-run: &run
  # The run folder: each stage's "done", "status", "at" and pipes
  type: bind
  source: ${CCS_RUN_DIR:-/var/lib/ccs/run}
  target: /run/ccs

x-health: &health
  interval: 1m
  timeout: 10s
  retries: 3
  start_period: 15m

x-step: &step /opt/ccs-bash/contrib/docker/backend/step

networks:
  # ccs-bash and the wallet only, with no way out
  wallet:
    internal: true
  # The wallet's way out: to monerod (wallet-rpc.conf's daemon-address)
  monerod: {}
  # The stages' way out: the forge, the web server, the backup machine
  default: {}

services:
  # Run once, as root: creates the run folder and a folder per stage, owned by its user
  init:
    image: ${CCS_BASH_IMAGE:?the attested ccs-bash image ID}
    pull_policy: never
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    user: "0:0"
    entrypoint: [*step, "init"]
    environment:
      CCS_UIDS: "pull=${GIT_UID:?} ccs-bash=${CCS_UID:?} backup=${SEND_UID:?} push=${PUSH_UID:?} watch=${WATCH_UID:?}"
      CCS_NOW_GID: ${WALLET_UID:?}
      CCS_WATCH_GID: ${WATCH_UID}
    volumes: [*run]
    restart: "no"
    profiles: [init]

  wallet-rpc:
    <<: *hardened
    image: ${WALLET_IMAGE:?the wallet-rpc image ID}
    # More room: a wallet's cache grows with every payment, and a rescan needs more
    mem_limit: 4g
    # RPC on the wallet network only (for ccs-bash), login in wallet-rpc.conf; out to monerod
    networks: [wallet, monerod]
    # For a monerod on this machine: daemon-address=host.docker.internal:18089, with its
    # restricted RPC listening where containers can reach it (docs/handover.md, 1)
    extra_hosts: ["host.docker.internal:host-gateway"]
    user: "${WALLET_UID:?}"
    environment:
      # The shared ring database (~/.shared-ringdb) is writable beside the wallet; the rest is read-only
      HOME: ${WALLET_DIR:-/var/lib/ccs/wallet}
    command: ["--config-file", "/etc/ccs-wallet/wallet-rpc.conf", "--non-interactive",
              "--rpc-bind-ip", "0.0.0.0", "--confirm-external-bind",
              "--tx-notify", "/usr/local/bin/ccs-notify %s"]
    # Healthy when its RPC port is open (bash's /dev/tcp; the image has no curl)
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/${WALLET_PORT:-18082}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - ${WALLET_CONF:-/etc/ccs-wallet/wallet-rpc.conf}:/etc/ccs-wallet/wallet-rpc.conf:ro
      - ${WALLET_DIR:-/var/lib/ccs/wallet}:${WALLET_DIR:-/var/lib/ccs/wallet}
      - *run

  # A synced view-only copy of a retired wallet, only for retire-wallet --again (docs/handover.md,
  # "Retiring a wallet"). Own files and config, no tx-notify. Started by hand, never by "up".
  retired-wallet-rpc:
    <<: *hardened
    image: ${WALLET_IMAGE}
    mem_limit: 4g
    networks: [wallet, monerod]
    extra_hosts: ["host.docker.internal:host-gateway"]
    user: "${WALLET_UID}"
    environment:
      HOME: ${RETIRED_WALLET_DIR:-/var/lib/ccs/retired-wallet}
    command: ["--config-file", "/etc/ccs-wallet/wallet-rpc.conf", "--non-interactive",
              "--rpc-bind-ip", "0.0.0.0", "--confirm-external-bind"]
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/${RETIRED_WALLET_PORT:-18083}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - ${RETIRED_WALLET_CONF:-/etc/ccs-wallet/retired-wallet-rpc.conf}:/etc/ccs-wallet/wallet-rpc.conf:ro
      - ${RETIRED_WALLET_DIR:-/var/lib/ccs/retired-wallet}:${RETIRED_WALLET_DIR:-/var/lib/ccs/retired-wallet}
    profiles: [retired]

  pull:
    <<: *hardened
    image: ${CCS_BASH_IMAGE}
    # Out to the forge (the default network: outgoing only; no egress filter)
    user: "${GIT_UID}"
    entrypoint: [*step, "pull"]
    environment: &every
      HOME: /tmp
      CCS_EVERY: ${CCS_EVERY:-120}
    healthcheck: {<<: *health, test: ["CMD", *step, "health", "pull"]}
    volumes:
      - /var/lib/ccs/proposals:/var/lib/ccs/proposals
      - ${CCS_PULL_OK:-/var/lib/ccs/pull-ok}:/var/lib/ccs/pull-ok
      - *run

  ccs-bash:
    <<: *hardened
    image: ${CCS_BASH_IMAGE}
    # The wallet (ccs.conf's RPC_URL: http://wallet-rpc:18082/json_rpc, port from wallet-rpc.conf), and out to the forge's API
    networks: [wallet, default]
    user: "${CCS_UID}"
    entrypoint: [*step, "ccs-bash"]
    environment: *every
    healthcheck: {<<: *health, test: ["CMD", *step, "health", "ccs-bash"]}
    depends_on:
      wallet-rpc:
        condition: service_healthy
    volumes:
      - /etc/ccs/ccs.conf:/etc/ccs/ccs.conf:ro
      - /var/lib/ccs/proposals:/var/lib/ccs/proposals:ro
      - /var/lib/ccs/state:/var/lib/ccs/state
      - /var/lib/ccs/out:/var/lib/ccs/out
      - *run

  backup:
    <<: *hardened
    image: ${CCS_BASH_IMAGE}
    # Its own user, so no other stage can read its key or sums. Out over ssh (no egress
    # filter: any address, like every stage with a way out).
    user: "${SEND_UID}"
    entrypoint: [*step, "backup"]
    environment:
      <<: *every
      CCS_BACKUP: ${CCS_BACKUP:?ccs-backup@<the backup machine>}
      CCS_BACKUP_PORT: ${CCS_BACKUP_PORT:-22}
    healthcheck: {<<: *health, test: ["CMD", *step, "health", "backup"]}
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - /var/lib/ccs/state:/var/lib/ccs/state:ro
      - ${CCS_BACKUP_KEYS:-/etc/ccs/backup}:/etc/ccs/backup:ro
      - *run

  push:
    <<: *hardened
    image: ${CCS_BASH_IMAGE}
    # Its own user, for its key and each run's result. Out over ssh.
    user: "${PUSH_UID}"
    entrypoint: [*step, "push"]
    environment:
      <<: *every
      CCS_PUSH: ${CCS_PUSH:?ccs-data@<the web server>}
      CCS_PUSH_PORT: ${CCS_PUSH_PORT:-22}
    healthcheck: {<<: *health, test: ["CMD", *step, "health", "push"]}
    volumes:
      - /etc/passwd:/etc/passwd:ro
      # The push key and the web server's host key (id_ed25519, known_hosts; owned by ccs-push, 600)
      - ${CCS_PUSH_KEYS:-/etc/ccs/push}:/etc/ccs/push:ro
      # site-data.json from ccs-bash: what is pushed
      - /var/lib/ccs/out:/var/lib/ccs/out:ro
      - *run

  # ccs-watch: after each run, and at random times between pushes. Out to the web server, and
  # to alert.conf's ALERT_URL and WATCH_PROXY.
  watch:
    <<: *hardened
    image: ${CCS_BASH_IMAGE}
    # Its own user, so other stages can't touch its state or the results it counts
    user: "${WATCH_UID}"
    # For a proxy on this machine (Tor, ssh -D): WATCH_PROXY=socks5h://host.docker.internal:9050
    extra_hosts: ["host.docker.internal:host-gateway"]
    entrypoint: [*step, "watch", "${CCS_SITE_URL:?the site's address, https://...}"]
    environment:
      <<: *every
      CCS_WATCH_STATE: /var/lib/ccs/watch
    healthcheck: {<<: *health, test: ["CMD", *step, "health", "watch"]}
    volumes:
      - ${CCS_ALERT_CONF:-/etc/ccs/alert.conf}:/etc/ccs/alert.conf:ro
      # The signed list and its QR codes (alert.conf's SUBADDRESSES) and ccs-bash's projects.json:
      # what the live pages' addresses are checked against. The design's sums (design.sha256)
      # and the proposals checkout: what their images are checked against.
      - /etc/ccs-front:/etc/ccs-front:ro
      - /var/lib/ccs/out:/var/lib/ccs/out:ro
      - /var/lib/ccs/proposals:/var/lib/ccs/proposals:ro
      # forge-ok, read only; its own state, writable
      - /var/lib/ccs/state:/var/lib/ccs/state:ro
      - ${CCS_WATCH_DIR:-/var/lib/ccs/watch}:/var/lib/ccs/watch
      - ${CCS_PULL_OK:-/var/lib/ccs/pull-ok}:/var/lib/ccs/pull-ok:ro
      - *run
