# Use with compose.yml on a host where monerod (wallet-rpc.conf's daemon-address), the watcher's
# proxy and the alert bot (alert.conf) listen on 127.0.0.1 only, as on the testnet.
# It puts wallet-rpc, ccs-bash and watch on the host's network, with the wallet's RPC on
# 127.0.0.1. Any process on the host can then reach it (docs/docker.md). The other stages stay
# as in compose.yml. In .env:
#   COMPOSE_FILE=compose.yml:compose.host.yml
# and in ccs.conf: RPC_URL=http://127.0.0.1:18082/json_rpc (port from wallet-rpc.conf).
services:
  wallet-rpc:
    network_mode: host
    networks: !reset []
    command: ["--config-file", "/etc/ccs-wallet/wallet-rpc.conf", "--non-interactive",
              "--rpc-bind-ip", "127.0.0.1",
              "--tx-notify", "/usr/local/bin/ccs-notify %s"]
  ccs-bash:
    network_mode: host
    networks: !reset []
  watch:
    network_mode: host
