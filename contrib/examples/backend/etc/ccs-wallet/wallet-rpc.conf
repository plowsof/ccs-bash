# /etc/ccs-wallet/wallet-rpc.conf (root:ccs-wallet 640): monero-wallet-rpc, the CCS wallet,
# view-only (setup step 1). The compose adds --rpc-bind-ip, --tx-notify and --non-interactive.
wallet-file=/var/lib/ccs/wallet/ccs
password=<wallet password: the wallet file's own>
# a monerod you trust, mainnet, its restricted RPC (docs/handover.md, 1): on this machine
# host.docker.internal:18089 (listening where containers reach it, not on 127.0.0.1 only),
# else that machine's address
daemon-address=<host.docker.internal, or the monerod host>:18089
rpc-bind-ip=127.0.0.1
rpc-bind-port=18082
# its user and password are ccs.conf's RPC_USER and RPC_PASSWORD
rpc-login=ccs:<rpc password>
log-file=/var/lib/ccs/wallet/monero-wallet-rpc.log
