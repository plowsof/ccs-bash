# /etc/ccs/ccs.conf (root:ccs 640) for ccs.getmonero.org, the backend in Docker (docs/docker.md).
# Every key, and the optional ones: ccs.conf.example. ccs config:check checks it.

# the wallet's RPC: wallet-rpc on the compose's internal network (only with compose.host.yml,
# docs/handover.md 1: http://127.0.0.1:18082/json_rpc); its port and login are wallet-rpc.conf's
RPC_URL=http://wallet-rpc:18082/json_rpc
RPC_USER=ccs
RPC_PASSWORD=<rpc password: wallet-rpc.conf's rpc-login, after the colon>

# the CCS wallet's main address (meta #935): every run checks the wallet against it. From your
# own records, not from the running wallet-rpc
WALLET_ADDRESS=41hzbgqgkrYijnRVBLzr1KHsYc1iUBBCJYeeT9d3eiYE2PhbohxxwJLZCNVbTzvAMkhtYGF3RQcr2Ea187AJn8af149UG1G

# the proposals repository's API (public, no token)
REPOSITORY_URL=https://repo.getmonero.org/api/v4/projects/54

PROPOSALS_DIR=/var/lib/ccs/proposals
STATE_DIR=/var/lib/ccs/state
OUTPUT_DIR=/var/lib/ccs/out
MIN_CONFIRMATIONS=10
