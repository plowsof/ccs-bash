# /etc/ccs/alert.conf (root:ccs 640): ccs-watch's (its header lists every key). Not in any
# repository. ccs-watch --test https://ccs.getmonero.org sends one message to check it.

# the IRC bot: one line POSTed as plain text (CptHook's simple module), reachable from the
# compose's containers (a bot on this machine's 127.0.0.1: compose.host.yml)
ALERT_URL=<https://bot.example/endpoint?channel=%23monero-ccs>
# addresses on a changed page that aren't the wallet's are named in the alert
SUBADDRESSES=/etc/ccs-front/subaddresses.txt
# fetched through these, one at random each time: Tor and a clearnet one elsewhere (ssh -D), so
# the web server can't tell the watcher by its address
WATCH_PROXY=<socks5h://tor-host:9050 socks5h://other-host:1080>
WATCH_THEMES=1
WATCH_SAMPLE=10
