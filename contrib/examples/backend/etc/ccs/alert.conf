# /etc/ccs/alert.conf (root:ccs-watch 640; the host setup: root:ccs): ccs-watch's (its header lists every key). Not in any
# repository. ccs-watch --test https://ccs.getmonero.org sends one message to check it.

# the IRC bot: one line POSTed as plain text (CptHook's simple module), on a third machine (not
# the backend, nor the web server: the gate's alarms go there too)
ALERT_URL=<https://bot.example/endpoint?channel=%23monero-ccs>
# addresses on a changed page that aren't the wallet's are named in the alert
SUBADDRESSES=/etc/ccs-front/subaddresses.txt
# fetched through these, one at random each time: Tor and a clearnet one elsewhere (ssh -D), so
# the web server can't tell the watcher by its address; one on this machine as
# host.docker.internal, listening on the bridge's address (docs/handover.md, 1)
WATCH_PROXY=<socks5h://host.docker.internal:9050 socks5h://host.docker.internal:1080>
WATCH_THEMES=1
WATCH_SAMPLE=10
