name: vulncheck
# Known vulnerabilities (Go's database) in:
#   - what ccs-check (contrib/ccs-check) calls in Go's standard library, as StageX's pinned Go has it
#     (ccs-check has no modules);
#   - the pinned Caddy binary (the web server's www: its Go and its modules). Fails on any not in
#     container/caddy-vulns-accepted, where each has a reason it doesn't reach the site.
# Also runs weekly, since new vulnerabilities are found in code that hasn't changed.
# On failure: refresh the Go pin (container/update-images.sh) and release
# (docs/ccs-check.md, "Keeping it patched").
on:
  pull_request:
    paths: [contrib/ccs-check/**, container/images, .github/workflows/vulncheck.yml]
  workflow_dispatch:
  push:
    branches: [master]
    paths: [contrib/ccs-check/**, container/images, .github/workflows/vulncheck.yml]
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: the source tarballs, kept from the last run (each still checked by its sha256)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3, pinned by commit
        with:
          path: container/sources
          key: sources-${{ hashFiles('container/sources.lock') }}
      - name: govulncheck, in StageX's Go (fails on a vulnerability in code ccs-check calls)
        run: contrib/ccs-check/build.sh vulncheck
      - name: and all it found, called or not (the Go pin's own, waiting on StageX)
        if: always()
        run: contrib/ccs-check/build.sh vulncheck -show verbose | grep -E '^Vulnerability|Found in|Fixed in' || true
      - name: the pinned Caddy's binary (fails on a vulnerability in code it calls)
        if: always()
        run: |
          ref=$(awk '$1 == "caddy" { print $2 }' container/images)
          docker pull -q "$ref" > /dev/null
          c=$(docker create "$ref" /x) && docker cp "$c:/usr/bin/caddy" "$RUNNER_TEMP/caddy" && docker container rm "$c" > /dev/null
          contrib/ccs-check/build.sh vulncheck-binary "$RUNNER_TEMP/caddy" -format json > "$RUNNER_TEMP/caddy.json" || true
          jq -r 'select(.finding) | .finding.osv' "$RUNNER_TEMP/caddy.json" | sort -u > "$RUNNER_TEMP/found"
          [[ -s $RUNNER_TEMP/found ]] || grep -q '"config"' "$RUNNER_TEMP/caddy.json" || { echo "govulncheck gave no answer"; exit 1; }
          grep -oE '^GO-[0-9]+-[0-9]+' container/caddy-vulns-accepted | sort -u > "$RUNNER_TEMP/accepted"
          echo "found $(wc -l < "$RUNNER_TEMP/found"), accepted $(wc -l < "$RUNNER_TEMP/accepted") (container/caddy-vulns-accepted)"
          gone=$(comm -13 "$RUNNER_TEMP/found" "$RUNNER_TEMP/accepted"); [[ -z $gone ]] || echo "no longer found (take them out): $gone"
          new=$(comm -23 "$RUNNER_TEMP/found" "$RUNNER_TEMP/accepted")
          [[ -z $new ]] || { echo "new, not accepted:"; jq -r --arg n "$new" 'select(.osv) | .osv | select(.id as $i | $n | split("\n") | index($i)) | "\(.id)  \(.summary)"' "$RUNNER_TEMP/caddy.json" | sort -u; exit 1; }
