name: check
# Once per change: pull requests, and pushes to master (a PR branch's push would run it twice).
on:
  push:
    branches: [master]
  pull_request:
# A newer commit on the same branch or PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    # 22.04 has jq 1.6 (as Debian 12), 24.04 has jq 1.7, which prints numbers differently.
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: shellcheck
        run: shellcheck -x ccs-back.sh notify-loop.sh lib/*.sh tests/*.sh container/*.sh contrib/ccs-receive contrib/ccs-watch contrib/ccs-backup-receive contrib/retire-wallet contrib/migrate/compare-deposits contrib/ccs contrib/docker/backend/step contrib/docker/backend/wallet-rpc/ccs-notify
      - name: tests (Ubuntu's awk is mawk)
        run: tests/run.sh
      - name: the backend compose's stages (contrib/docker/backend/step)
        run: tests/compose.sh
      - name: tests with gawk
        run: |
          sudo apt-get install -y gawk
          mkdir -p "$RUNNER_TEMP/gawk" && ln -s "$(command -v gawk)" "$RUNNER_TEMP/gawk/awk"
          PATH="$RUNNER_TEMP/gawk:$PATH" tests/run.sh
  image:
    # The pinned image: StageX images by digest + busybox built from a sha256-checked source,
    # built with --network none, then the tests run inside it, also without network.
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.id.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: build (download, then install offline)
        run: container/build.sh ccs-bash
      - name: tests inside the image, no network
        run: docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD:/src:ro" --entrypoint bash ccs-bash /src/tests/run.sh
      - name: the backend compose's stages, in the image (its busybox; the stand-ins run from /tmp)
        run: docker run --rm --network none --read-only --tmpfs /tmp:exec -v "$PWD:/src:ro" --entrypoint bash ccs-bash /src/tests/compose.sh
      - name: the stages' own tools (git, ssh, rsync, openssl, ccs-watch's), and only those
        run: docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD:/src:ro" --entrypoint bash ccs-bash /src/tests/image.sh
      - name: ccs-watch as the image runs it (its busybox; the test's servers on the host's 127.0.0.1)
        run: CCS_WATCH_IMAGE=ccs-bash tests/watch.sh
      - name: the image's size (only what is run; 71 MB with git and ssh)
        run: size=$(docker image inspect ccs-bash --format '{{.Size}}'); echo "$size bytes"; [ "$size" -lt 90000000 ]
      - id: id
        run: echo "id=$(docker image inspect ccs-bash --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
  # The same commit must build to the same image ID anywhere: a second machine, a fresh clone made
  # under umask 077, building another commit first and then this one on its cache (as node3 does).
  # The same ID as the clean build above covers machines, umasks and caches at once.
  pinned-warm:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.id.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - id: id
        run: |
          id=$(umask 077 && container/check-pinned.sh warm | sed -n 's/^id: //p')
          echo "warm: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
  pinned:
    needs: [image, pinned-warm]
    runs-on: ubuntu-24.04
    steps:
      - name: pinned image hash (two machines, a clean build and a cached one, one ID)
        env:
          IDS: ${{ needs.image.outputs.id }} ${{ needs.pinned-warm.outputs.id }}
        run: |
          read -r a b <<<"$IDS"
          echo "clean build (and tests): $a"; echo "another machine, umask 077, on another commit's cache: $b"
          [[ $a == sha256:* && $a == "$b" ]] || { echo "error: the builds differ, or one is missing" >&2; exit 1; }
          echo "pinned: commit ${GITHUB_SHA::7} builds to $a"
  rrsync:
    # The two-machine setup (docs/two-machines.md, rrsync), attacked from the wallet machine's key.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: rrsync restrictions
        run: tests/rrsync.sh
      - name: the gate (contrib/ccs-receive)
        run: tests/gate.sh
      - name: the watcher (contrib/ccs-watch)
        run: tests/watch.sh
