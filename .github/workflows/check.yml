name: check
# Once per change: pull requests, and pushes to master (a PR branch's push would run it twice).
on:
  push:
    branches: [master]
  pull_request:
# A newer commit on the same branch or PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    # 22.04 has jq 1.6 (as Debian 12), 24.04 has jq 1.7, which prints numbers differently.
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: shellcheck
        run: shellcheck -x ccs-back.sh notify-loop.sh lib/*.sh tests/*.sh container/*.sh contrib/ccs-receive contrib/ccs-watch contrib/ccs-backup-receive contrib/retire-wallet contrib/migrate/compare-deposits contrib/ccs contrib/docker/backend/step contrib/docker/backend/wallet-rpc/ccs-notify contrib/docker/web/init contrib/ccs-check/build.sh
      - name: tests (Ubuntu's awk is mawk)
        run: tests/run.sh
      - name: the backend compose's stages (contrib/docker/backend/step)
        run: tests/compose.sh
      - name: tests with gawk (on one Ubuntu, as the awk is what differs)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y gawk
          mkdir -p "$RUNNER_TEMP/gawk" && ln -s "$(command -v gawk)" "$RUNNER_TEMP/gawk/awk"
          PATH="$RUNNER_TEMP/gawk:$PATH" tests/run.sh
  image:
    # The pinned image: StageX images by digest + busybox built from a sha256-checked source,
    # built with --network none, then the tests run inside it, also without network.
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.id.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: the source tarballs, kept from the last run (each still checked by its sha256)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3, pinned by commit
        with:
          path: container/sources
          key: sources-${{ hashFiles('container/sources.lock') }}
      - name: build (download, then install offline)
        run: container/build.sh ccs-bash
      - name: tests inside the image, no network
        run: docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD:/src:ro" --entrypoint bash ccs-bash /src/tests/run.sh
      - name: the backend compose's stages, in the image (its busybox; the stand-ins run from /tmp)
        run: docker run --rm --network none --read-only --tmpfs /tmp:exec -v "$PWD:/src:ro" --entrypoint bash ccs-bash /src/tests/compose.sh
      - name: the stages' own tools (git, ssh, rsync, openssl, ccs-watch's), and only those
        run: docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD:/src:ro" --entrypoint bash ccs-bash /src/tests/image.sh
      - name: ccs-watch as the image runs it (its busybox; the test's servers on the host's 127.0.0.1)
        run: CCS_WATCH_IMAGE=ccs-bash tests/watch.sh
      - name: the image's size (only what is run; 71 MB with git and ssh)
        run: size=$(docker image inspect ccs-bash --format '{{.Size}}'); echo "$size bytes"; [ "$size" -lt 90000000 ]
      - id: id
        run: echo "id=$(docker image inspect ccs-bash --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
  # The same commit must build to the same image ID anywhere: a second machine, a fresh clone made
  # under umask 077, building another commit first and then this one on its cache (as node3 does).
  # The same ID as the clean build above covers machines, umasks and caches at once.
  pinned-warm:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.id.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: the source tarballs, kept from the last run (each still checked by its sha256)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3, pinned by commit
        with:
          path: container/sources
          key: sources-${{ hashFiles('container/sources.lock') }}
      - id: id
        run: |
          id=$(umask 077 && container/check-pinned.sh warm | sed -n 's/^id: //p')
          echo "warm: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
  pinned:
    needs: [image, pinned-warm]
    runs-on: ubuntu-24.04
    steps:
      - name: pinned image hash (two machines, a clean build and a cached one, one ID)
        env:
          IDS: ${{ needs.image.outputs.id }} ${{ needs.pinned-warm.outputs.id }}
        run: |
          read -r a b <<<"$IDS"
          echo "clean build (and tests): $a"; echo "another machine, umask 077, on another commit's cache: $b"
          [[ $a == sha256:* && $a == "$b" ]] || { echo "error: the builds differ, or one is missing" >&2; exit 1; }
          echo "pinned: commit ${GITHUB_SHA::7} builds to $a"
  gate-image:
    # The gate's image (container/gate.Dockerfile, the web server compose): built as the ccs-bash
    # image is, its QR reader and tools tested inside it, the gate's tests with it as the web
    # server, its sshd as compose.yml runs it attacked from the backend's keys. (gate-pinned: a
    # second clean build, from a clone made under umask 077, gives the same ID.)
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.id.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: the source tarballs, kept from the last run (each still checked by its sha256)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3, pinned by commit
        with:
          path: container/sources
          key: sources-${{ hashFiles('container/sources.lock') }}
      - name: build (download, then install offline)
        run: container/build.sh ccs-gate gate.Dockerfile
      - name: its QR reader and tools, inside it, no network
        run: docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD:/src:ro" --entrypoint bash ccs-gate /src/tests/gate-image.sh
      - name: ccs-check, gofmt'd, vetted and its Go tests, in StageX's Go; build.sh's bytes the image's
        run: |
          contrib/ccs-check/build.sh test
          b=$(contrib/ccs-check/build.sh "$RUNNER_TEMP/ccs-check" | cut -d' ' -f1)
          i=$(docker run --rm --network none --entrypoint sha256sum ccs-gate /usr/local/bin/ccs-check | cut -d' ' -f1)
          echo "build.sh: $b, the image: $i"; [[ $b == "$i" ]]
      - name: the gate's tests, the web server being this image
        run: GATE_IMAGE=ccs-gate tests/gate.sh
      - name: the web server compose's sshd, attacked from the backend's keys
        run: CCS_GATE_IMAGE=ccs-gate tests/web.sh
      - name: the image's size (git, sshd, GNU userland, ccs-check; no Python; about 110 MB)
        run: size=$(docker image inspect ccs-gate --format '{{.Size}}'); echo "$size bytes"; [ "$size" -lt 130000000 ]
      - id: id
        run: echo "id=$(docker image inspect ccs-gate --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
  # its second build, beside the first (not after it): a clean one, from a clone made under umask 077
  gate-clean:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.id.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: the source tarballs, kept from the last run (each still checked by its sha256)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3, pinned by commit
        with:
          path: container/sources
          key: sources-${{ hashFiles('container/sources.lock') }}
      - id: id
        run: |
          id=$(umask 077 && CHECK_DOCKERFILE=gate.Dockerfile container/check-pinned.sh clean 077 | sed -n 's/^id: //p')
          echo "clean: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
  gate-pinned:
    needs: [gate-image, gate-clean]
    runs-on: ubuntu-24.04
    steps:
      - name: the gate's image hash (the tested build and a clean one, one ID)
        env:
          IDS: ${{ needs.gate-image.outputs.id }} ${{ needs.gate-clean.outputs.id }}
        run: |
          read -r a b <<<"$IDS"
          echo "the tested build: $a"; echo "a clean one: $b"
          [[ $a == sha256:* && $a == "$b" ]] || { echo "error: the gate image's builds differ, or one is missing" >&2; exit 1; }
  fuzz:
    # ccs-check's fuzz tests (contrib/ccs-check/*/fuzz_test.go), a minute each, in StageX's Go: no
    # panic or hang on any input, and what each must always say (rrsync: only the push's shape;
    # pages: one line a page...). A failing input is printed; commit it under testdata/fuzz/.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: the source tarballs, kept from the last run (each still checked by its sha256)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3, pinned by commit
        with:
          path: container/sources
          key: sources-${{ hashFiles('container/sources.lock') }}
      - name: go test -fuzz, 60 s a test
        run: contrib/ccs-check/build.sh fuzz 60
  regtest:
    # The backend against a real monerod (regtest, offline) and monero-wallet-rpc: what a visitor
    # sees (totals, pending, contributions) checked against what the test sent (tests/regtest.sh)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: the Monero releases and the design's zip, kept from the last run (each still checked by its sha256)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3, pinned by commit
        with:
          path: ~/.cache/ccs-regtest
          key: regtest-${{ hashFiles('tests/regtest.sh') }}
      - name: ccs-front-bash, at the release the set runs, and qrencode for it
        run: |
          git clone -q --depth 1 -b v0.1.20 https://github.com/plowsof/ccs-front-bash "$RUNNER_TEMP/ccs-front-bash"
          sudo apt-get install -y -q qrencode > /dev/null
      - name: tests/regtest.sh
        run: FRONT_BASH="$RUNNER_TEMP/ccs-front-bash" tests/regtest.sh
  host-tests:
    name: host tests (rrsync, the gate, the watcher)
    # The two-machine setup (docs/two-machines.md, rrsync), attacked from the wallet machine's key.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: the source tarballs, kept from the last run (each still checked by its sha256)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3, pinned by commit
        with:
          path: container/sources
          key: sources-${{ hashFiles('container/sources.lock') }}
      - name: rrsync restrictions
        run: tests/rrsync.sh
      - name: the same, on ccs-check rrsync (the gate's, in place of rrsync)
        run: |
          contrib/ccs-check/build.sh "$RUNNER_TEMP/ccs-check"
          CCS_CHECK="$RUNNER_TEMP/ccs-check" tests/rrsync.sh
      - name: the gate (contrib/ccs-receive)
        run: tests/gate.sh
      - name: the watcher (contrib/ccs-watch)
        run: tests/watch.sh
