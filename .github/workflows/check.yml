name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    # 22.04 has jq 1.6 (as Debian 12), 24.04 has jq 1.7, which prints numbers differently.
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: install qrencode, and zbarimg to read its codes back (tests only)
        run: sudo apt-get update -q && sudo apt-get install -y -q qrencode zbar-tools
      - name: shellcheck
        run: shellcheck -x ccs-back.sh notify-loop.sh lib/*.sh tests/*.sh
      - name: tests (Ubuntu's awk is mawk)
        run: tests/run.sh
      - name: tests with gawk
        run: |
          sudo apt-get install -y gawk
          mkdir -p "$RUNNER_TEMP/gawk" && ln -s "$(command -v gawk)" "$RUNNER_TEMP/gawk/awk"
          PATH="$RUNNER_TEMP/gawk:$PATH" tests/run.sh
  image:
    # The pinned image: StageX images by digest + qrencode built from a sha256-checked source,
    # built with --network none, then the tests run inside it, also without network.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: build (download, then install offline)
        run: container/build.sh ccs-bash
      - name: tests inside the image, no network
        run: docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD:/src:ro" --entrypoint bash ccs-bash /src/tests/run.sh
      - name: pinned image hash (two clean builds, and one after another commit, same hash)
        run: container/check-pinned.sh
  rrsync:
    # The README's two-machine setup (rrsync), attacked from the wallet machine's key.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: rrsync restrictions
        run: tests/rrsync.sh
