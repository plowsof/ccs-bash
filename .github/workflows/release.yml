name: release
# On a pushed tag v*: build the pinned image, test it, check (check-pinned.sh) builds give the same
# hash, push it to ghcr.io/<owner>/ccs-bash:<tag> and make a GitHub release with both hashes; the
# gate's image too (container/gate.Dockerfile, ghcr.io/<owner>/ccs-bash:<tag>-gate), its ID in the
# notes as "Gate image ID" (contrib/release/build attests both); and its ccs-check, copied out of
# that image, as an asset with its sha256 in the notes, for a gate set up on a host (no Docker).
on:
  push:
    tags: ['v*']
permissions:
  contents: write   # the GitHub release
  packages: write   # ghcr.io
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - name: build (download, then install offline)
        run: container/build.sh ccs-bash
      - name: tests inside the image, no network
        run: docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD:/src:ro" --entrypoint bash ccs-bash /src/tests/run.sh
      - name: pinned image hash (two clean builds, and one after another commit, same hash)
        run: container/check-pinned.sh
      - name: the gate's image, built and tested
        run: |
          container/build.sh ccs-gate gate.Dockerfile
          docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD:/src:ro" --entrypoint bash ccs-gate /src/tests/gate-image.sh
          GATE_IMAGE=ccs-gate tests/gate.sh
          CCS_GATE_IMAGE=ccs-gate tests/web.sh
      - name: the gate's image hash (a clean build, the same)
        run: |
          b=$(CHECK_DOCKERFILE=gate.Dockerfile container/check-pinned.sh clean 077 | sed -n 's/^id: //p')
          [[ $(docker image inspect ccs-gate --format '{{.Id}}') == "$b" ]]
      - name: push to ghcr.io and make the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag ccs-bash "$image:$TAG"
          docker push -q "$image:$TAG"
          docker tag ccs-gate "$image:$TAG-gate"
          docker push -q "$image:$TAG-gate"
          id=$(docker image inspect ccs-bash --format '{{.Id}}')
          digest=$(docker image inspect "$image:$TAG" --format '{{index .RepoDigests 0}}')
          gate=$(docker image inspect ccs-gate --format '{{.Id}}')
          gate_digest=$(docker image inspect "$image:$TAG-gate" --format '{{index .RepoDigests 0}}')
          # the gate's checks, the gate image's own bytes (attested with it), for a host setup
          c=$(docker create ccs-gate) && docker cp "$c:/usr/local/bin/ccs-check" "ccs-check-$TAG-linux-amd64" && docker rm "$c" > /dev/null
          check=$(sha256sum < "ccs-check-$TAG-linux-amd64" | cut -d' ' -f1)
          notes=$(cat <<EOF
          Image, pulled by its digest (a tag can be moved, a digest can't):

          \`\`\`
          docker pull $digest
          \`\`\`

          Image ID: \`$id\`

          After pulling, \`docker image inspect $digest --format '{{.Id}}'\` must print that ID.
          It is also what building this tag yourself gives (\`container/build.sh\`), so you can
          check that this image is the code in this tag instead of trusting this build.

          The gate's image (the web server compose, contrib/docker/web): \`docker pull $gate_digest\`

          Gate image ID: \`$gate\`

          Built yourself: \`container/build.sh ccs-gate gate.Dockerfile\`.

          The gate's checks, for a host setup (docs/two-machines.md): \`ccs-check-$TAG-linux-amd64\`,
          ccs-check sha256: \`$check\`. The gate image's own /usr/local/bin/ccs-check (so attested with
          it); also what \`contrib/ccs-check/build.sh\` makes from this tag.
          EOF
          )
          # a release made by hand on GitHub (which also makes the tag) keeps its text
          if gh release view "$TAG" > /dev/null 2>&1; then
              gh release edit "$TAG" --notes "$(gh release view "$TAG" --json body -q .body)"$'\n\n'"$notes"
          else
              gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes"
          fi
          gh release upload "$TAG" "ccs-check-$TAG-linux-amd64" --clobber
