<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="gb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>

  <rect width="1200" height="830" fill="#ffffff"/>

  <!-- title -->
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">CCS: recommended architecture</text>
  <text x="30" y="62" font-size="13.5" fill="#475569">Bash on the backend computes and renders everything and only connects out. The public web server only receives files and serves them.</text>

  <g transform="translate(0,115)">
  <!-- zones -->
  <rect x="230" y="85" width="530" height="545" rx="16" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="230" y="85" width="530" height="40" rx="16" fill="#3b6fd8"/>
  <rect x="230" y="105" width="530" height="20" fill="#3b6fd8"/>
  <g transform="translate(250,95)" fill="none" stroke="#ffffff" stroke-width="2">
    <rect x="0" y="8" width="16" height="12" rx="2" fill="#ffffff"/>
    <path d="M3,8 V5 a5,5 0 0 1 10,0 V8"/>
  </g>
  <text x="276" y="111" font-size="15" font-weight="700" fill="#ffffff">BACKEND</text>
  <text x="358" y="111" font-size="13" fill="#dbe7ff">private · no inbound connections</text>

  <rect x="795" y="180" width="220" height="370" rx="16" fill="#fff7ea" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="795" y="180" width="220" height="40" rx="16" fill="#d97706"/>
  <rect x="795" y="200" width="220" height="20" fill="#d97706"/>
  <text x="815" y="206" font-size="15" font-weight="700" fill="#ffffff">WEB SERVER</text>
  <text x="929" y="206" font-size="13" fill="#ffedd5">public</text>

  <!-- sources -->
  <g filter="url(#sh)">
    <rect x="30" y="130" width="165" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="30" y="420" width="165" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="30" y="130" width="6" height="86" rx="3" fill="#64748b"/>
  <rect x="30" y="420" width="6" height="86" rx="3" fill="#64748b"/>
  <text x="115" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">GitLab</text>
  <text x="115" y="182" text-anchor="middle" font-size="12.5" fill="#475569">ccs-proposals repo</text>
  <text x="115" y="199" text-anchor="middle" font-size="12.5" fill="#475569">merge requests</text>
  <text x="115" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">monerod</text>
  <text x="115" y="472" text-anchor="middle" font-size="12.5" fill="#475569">local, or a node</text>
  <text x="115" y="489" text-anchor="middle" font-size="12.5" fill="#475569">you trust</text>

  <!-- backend cards -->
  <g filter="url(#sh)" fill="#ffffff" stroke="#cbd5e1">
    <rect x="520" y="150" width="210" height="98" rx="10"/>
    <rect x="265" y="280" width="200" height="98" rx="10"/>
    <rect x="520" y="280" width="210" height="98" rx="10"/>
    <rect x="265" y="420" width="200" height="86" rx="10"/>
    <rect x="520" y="420" width="210" height="86" rx="10"/>
  </g>
  <rect x="520" y="150" width="6" height="98" rx="3" fill="#7c3aed"/>
  <rect x="265" y="280" width="6" height="98" rx="3" fill="#16a34a"/>
  <rect x="520" y="280" width="6" height="98" rx="3" fill="#16a34a"/>
  <rect x="265" y="420" width="6" height="86" rx="3" fill="#3b6fd8"/>
  <rect x="520" y="420" width="6" height="86" rx="3" fill="#16a34a"/>

  <g text-anchor="middle">
    <text x="627" y="180" font-size="15" font-weight="700" fill="#0f172a">the original</text>
    <text x="627" y="200" font-size="12.5" fill="#475569">ccs-front-hugo's built site,</text>
    <text x="627" y="217" font-size="12.5" fill="#475569">HTML with markers</text>
    <text x="627" y="237" font-size="11.5" font-weight="600" fill="#7c3aed">NEVER MODIFIED</text>

    <text x="367" y="310" font-size="15" font-weight="700" fill="#0f172a">ccs-bash</text>
    <text x="367" y="330" font-size="12.5" fill="#475569">totals, addresses, ideas</text>
    <text x="367" y="347" font-size="12.5" fill="#475569">→ JSON (data only)</text>
    <text x="367" y="367" font-size="11.5" font-weight="600" fill="#16a34a">EVERY 2 MIN OR ON A TX</text>

    <text x="627" y="310" font-size="15" font-weight="700" fill="#0f172a">ccs-front-bash</text>
    <text x="627" y="330" font-size="12.5" fill="#475569">copies the original, string-</text>
    <text x="627" y="347" font-size="12.5" fill="#475569">replaces between markers</text>
    <text x="627" y="367" font-size="11.5" font-weight="600" fill="#16a34a">EVERY RUN · BASH, AWK, JQ</text>

    <text x="367" y="452" font-size="15" font-weight="700" fill="#0f172a">monero-wallet-rpc</text>
    <text x="367" y="472" font-size="12.5" fill="#475569">view-only, own user</text>
    <text x="367" y="489" font-size="12.5" fill="#475569">127.0.0.1 only</text>

    <text x="650" y="452" font-size="15" font-weight="700" fill="#0f172a">site/</text>
    <text x="627" y="472" font-size="12.5" fill="#475569">lists, amounts, QR codes,</text>
    <text x="627" y="489" font-size="12.5" fill="#475569">new pages; fresh each run</text>
  </g>
  <!-- folder icon -->
  <path d="M588,439 h10 l3,4 h15 v14 h-28 z" fill="#16a34a" opacity="0.85"/>

  <!-- state file: cylinder -->
  <g transform="translate(300,548)">
    <path d="M0,10 v40 a65,10 0 0 0 130,0 v-40" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.5"/>
    <ellipse cx="65" cy="10" rx="65" ry="10" fill="#dbe7ff" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="65" y="38" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">proposals.csv</text>
    <text x="65" y="54" text-anchor="middle" font-size="11.5" fill="#475569">state · back it up</text>
  </g>

  <!-- web cards -->
  <g filter="url(#sh)" fill="#ffffff" stroke="#cbd5e1">
    <rect x="815" y="245" width="180" height="90" rx="10"/>
    <rect x="815" y="390" width="180" height="86" rx="10"/>
    <rect x="1050" y="390" width="135" height="86" rx="10"/>
  </g>
  <rect x="815" y="245" width="6" height="90" rx="3" fill="#d97706"/>
  <rect x="815" y="390" width="6" height="86" rx="3" fill="#d97706"/>
  <rect x="1050" y="390" width="6" height="86" rx="3" fill="#64748b"/>
  <g text-anchor="middle">
    <text x="908" y="275" font-size="15" font-weight="700" fill="#0f172a">ccs-data</text>
    <text x="908" y="295" font-size="12.5" fill="#475569">ssh key: rrsync, write-only,</text>
    <text x="908" y="312" font-size="12.5" fill="#475569">one folder, no shell</text>
    <text x="908" y="422" font-size="15" font-weight="700" fill="#0f172a">nginx</text>
    <text x="908" y="442" font-size="12.5" fill="#475569">static files only</text>
    <text x="1120" y="422" font-size="15" font-weight="700" fill="#0f172a">Visitors</text>
    <text x="1120" y="442" font-size="12.5" fill="#475569">Tor welcome</text>
    <text x="1120" y="459" font-size="12.5" fill="#475569">no JS needed</text>
  </g>
  <text x="905" y="510" text-anchor="middle" font-size="12" fill="#9a3412">no Node, npm, Jekyll, Astro,</text>
  <text x="905" y="527" text-anchor="middle" font-size="12" fill="#9a3412">Ruby or PHP here</text>
  <!-- globe icon -->
  <g transform="translate(1158,404)" fill="none" stroke="#64748b" stroke-width="1.4">
    <circle cx="8" cy="8" r="8"/><ellipse cx="8" cy="8" rx="3.5" ry="8"/><path d="M0,8 h16"/>
  </g>

  <!-- arrows: data in (outgoing connections) -->
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#s)">
    <path d="M195,175 H240 V310 H261"/>
    <path d="M195,463 H261"/>
  </g>
    <text x="200" y="262" font-size="12" fill="#475569" transform="rotate(-90 205 262)">git pull, API</text>
  <!-- every run -->
  <g fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)">
    <path d="M367,420 V382"/>
    <path d="M465,325 H516"/>
    <path d="M627,378 V416"/>
  </g>
  <path d="M290,378 V548" fill="none" stroke="#3b6fd8" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="375" y="400" font-size="12" fill="#15803d">RPC</text>
  <text x="490" y="316" text-anchor="middle" font-size="12" fill="#15803d">JSON</text>
  <text x="490" y="342" text-anchor="middle" font-size="12" fill="#15803d">.md</text>
  <!-- on a merge -->
  <path d="M627,248 V276" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#s)"/>
    <!-- the push -->
  <path d="M730,463 H770 V290 H809" fill="none" stroke="#16a34a" stroke-width="3.5" marker-end="url(#gb)"/>
  <g transform="translate(700,580)">
    <rect x="0" y="0" width="230" height="30" rx="15" fill="#dcfce7" stroke="#16a34a"/>
    <text x="115" y="20" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">ssh push, write-only, every run</text>
  </g>
  <path d="M770,463 V578" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- web server inside -->
  <path d="M905,335 V386" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#o)"/>
  <path d="M995,433 H1046" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#o)"/>
  <text x="1002" y="421" font-size="12" fill="#b45309">HTTPS</text>

  </g>

  <!-- offline front-end build: outside, above the backend; drawn last so the arrow is on top -->
  <rect x="455" y="80" width="340" height="92" rx="12" fill="#f5f0ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" filter="url(#sh)"/>
  <text x="625" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ccs-front-hugo (offline)</text>
  <text x="625" y="123" text-anchor="middle" font-size="12.5" fill="#475569">the only place a framework (Hugo) runs: it builds</text>
  <text x="625" y="140" text-anchor="middle" font-size="12.5" fill="#475569">the site once, on a machine that is never live</text>
  <text x="625" y="161" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7c3aed">ONCE PER DESIGN CHANGE</text>
  <path d="M625,172 V261" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#p)"/>
  <g transform="translate(372,180)">
    <rect x="0" y="0" width="240" height="22" rx="11" fill="#ffffff" stroke="#7c3aed"/>
    <text x="120" y="15" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6d28d9">carried over once: signed, hash checked</text>
  </g>

  <!-- legend -->
  <g transform="translate(30,775)" font-size="12.5" fill="#334155">
    <path d="M0,10 H34" stroke="#16a34a" stroke-width="3"/><text x="42" y="14">every run (2 min, or on a new tx)</text>
    <path d="M265,10 H299" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 4"/><text x="307" y="14">once, from an offline machine</text>
    <path d="M520,10 H554" stroke="#64748b" stroke-width="2.5"/><text x="562" y="14">fetched or read by the backend (it only connects out)</text>
    <text x="0" y="40" fill="#64748b">No Jekyll or front-end framework on any live machine. Every page is made fresh from the original and pushed, each run.</text>
  </g>
</svg>
