<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="480" fill="#ffffff"/>

  <!-- outside -->
  <g stroke="#334155" stroke-width="1.5">
    <rect x="20" y="70" width="150" height="70" rx="6" fill="#f1f5f9"/>
    <rect x="20" y="300" width="150" height="60" rx="6" fill="#f1f5f9"/>
    <rect x="862" y="250" width="126" height="60" rx="6" fill="#f1f5f9"/>
  </g>
  <g fill="#0f172a" text-anchor="middle">
    <text x="95" y="98" font-weight="bold">GitLab</text>
    <text x="95" y="116">ccs-proposals</text>
    <text x="95" y="327" font-weight="bold">monerod</text>
    <text x="95" y="345">local or a trusted node</text>
    <text x="925" y="277" font-weight="bold">Visitors</text>
    <text x="925" y="295">Tor ok, no JS needed</text>
  </g>

  <!-- backend -->
  <rect x="210" y="20" width="420" height="410" rx="10" fill="#eef4fb" stroke="#334155" stroke-width="2"/>
  <text x="420" y="45" text-anchor="middle" font-weight="bold" font-size="15" fill="#0f172a">Backend machine: no inbound connections</text>
  <g stroke="#334155" stroke-width="1.5" fill="#ffffff">
    <rect x="230" y="170" width="170" height="70" rx="6"/>
    <rect x="230" y="290" width="170" height="60" rx="6"/>
    <rect x="430" y="70" width="180" height="80" rx="6"/>
    <rect x="430" y="195" width="180" height="80" rx="6"/>
    <rect x="430" y="320" width="180" height="55" rx="6"/>
  </g>
  <g fill="#0f172a" text-anchor="middle">
    <text x="315" y="195" font-weight="bold">ccs-bash</text>
    <text x="315" y="213">JSON + state file</text>
    <text x="315" y="230">every 2 min, or on a tx</text>
    <text x="315" y="315" font-weight="bold">monero-wallet-rpc</text>
    <text x="315" y="333">view-only, own user</text>
    <text x="520" y="95" font-weight="bold">site build (slow path)</text>
    <text x="520" y="113">ccs-front, pinned image,</text>
    <text x="520" y="130">no network, on each merge</text>
    <text x="520" y="220" font-weight="bold">ccs-front-bash (fast path)</text>
    <text x="520" y="238">fills lists + donation boxes</text>
    <text x="520" y="255">every run</text>
    <text x="520" y="345" font-weight="bold">site/</text>
    <text x="520" y="362">complete static HTML</text>
  </g>

  <!-- web server -->
  <rect x="660" y="120" width="190" height="220" rx="10" fill="#fdf3e7" stroke="#334155" stroke-width="2"/>
  <text x="755" y="145" text-anchor="middle" font-weight="bold" font-size="15" fill="#0f172a">Web server</text>
  <g stroke="#334155" stroke-width="1.5" fill="#ffffff">
    <rect x="680" y="160" width="150" height="60" rx="6"/>
    <rect x="680" y="250" width="150" height="60" rx="6"/>
  </g>
  <g fill="#0f172a" text-anchor="middle">
    <text x="755" y="185" font-weight="bold">ccs-data</text>
    <text x="755" y="203">rrsync, write-only</text>
    <text x="755" y="275" font-weight="bold">nginx</text>
    <text x="755" y="293">static files only</text>
  </g>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M170,100 L428,100"/>
    <path d="M190,100 L190,190 L228,190"/>
    <path d="M170,330 L228,320"/>
    <path d="M315,290 L315,242"/>
    <path d="M400,215 L428,230"/>
    <path d="M520,150 L520,193"/>
    <path d="M520,275 L520,318"/>
    <path d="M610,348 L645,348 L645,190 L678,190"/>
    <path d="M755,220 L755,248"/>
    <path d="M830,280 L860,280"/>
  </g>
  <g fill="#334155" font-size="12">
    <text x="232" y="92">proposals, MRs (outgoing)</text>
    <text x="324" y="270">127.0.0.1</text>
    <text x="653" y="375">ssh push, every run</text>
    <text x="764" y="240">files</text>
  </g>
  <text x="500" y="465" text-anchor="middle" fill="#334155" font-size="12">Arrows are data flow. The backend only connects out; the web server only receives files and serves them.</text>
</svg>
