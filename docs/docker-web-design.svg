<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">CCS: the web server in Docker</text>
  <text x="30" y="62" font-size="13.5" fill="#475569">The web server's side of two machines (docs/two-machines.md) from one attested StageX image: the gate behind its own sshd, and</text>
  <text x="30" y="80" font-size="13.5" fill="#475569">(a profile, on the backup machine) the backup receiver behind another. nginx stays on the host and serves the same folder.</text>

  <!-- the backend -->
  <rect x="20" y="110" width="230" height="300" rx="16" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="20" y="110" width="230" height="40" rx="16" fill="#3b6fd8"/>
  <rect x="20" y="130" width="230" height="20" fill="#3b6fd8"/>
  <text x="40" y="136" font-size="15" font-weight="700" fill="#ffffff">BACKEND</text>
  <g font-size="12" fill="#334155">
    <g filter="url(#sh)"><rect x="40" y="170" width="190" height="80" rx="10" fill="#ffffff" stroke="#94a3b8"/></g>
    <text x="55" y="195" font-size="14" font-weight="700" fill="#0f172a">push</text>
    <text x="55" y="215">what changed, rsync over ssh</text>
    <text x="55" y="233" fill="#b45309" font-weight="600">the push key</text>
    <g filter="url(#sh)"><rect x="40" y="270" width="190" height="80" rx="10" fill="#ffffff" stroke="#94a3b8"/></g>
    <text x="55" y="295" font-size="14" font-weight="700" fill="#0f172a">backup</text>
    <text x="55" y="315">the state, when it changes</text>
    <text x="55" y="333" fill="#b45309" font-weight="600">the backup key</text>
  </g>
  <text x="40" y="385" font-size="11.5" fill="#475569">its watch fetches the live pages</text>
  <text x="40" y="400" font-size="11.5" fill="#475569">as a visitor would (ccs-watch)</text>

  <!-- the web server -->
  <rect x="300" y="110" width="600" height="570" rx="16" fill="#fff7ea" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="300" y="110" width="600" height="40" rx="16" fill="#d97706"/>
  <rect x="300" y="130" width="600" height="20" fill="#d97706"/>
  <text x="320" y="136" font-size="15" font-weight="700" fill="#ffffff">WEB SERVER</text>
  <text x="448" y="136" font-size="13" fill="#ffedd5">public · only receives files and serves them</text>

  <!-- the compose -->
  <rect x="320" y="165" width="560" height="315" rx="12" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="335" y="187" font-size="12.5" font-weight="700" fill="#1e3a8a">compose.yml · the gate's image, by attested ID · the host's network</text>
  <g font-size="12" fill="#334155">
    <g filter="url(#sh)"><rect x="335" y="200" width="260" height="140" rx="10" fill="#ffffff" stroke="#94a3b8"/></g>
    <text x="350" y="225" font-size="15" font-weight="700" fill="#0f172a">gate · port 2223</text>
    <text x="350" y="247">sshd: AllowUsers ccs-data,</text>
    <text x="350" y="265">ForceCommand ccs-receive</text>
    <text x="350" y="283">the key's from=: the backend only</text>
    <text x="350" y="301">checks each changed page, address, QR</text>
    <text x="350" y="319">writes: staging, the live site</text>

    <g filter="url(#sh)"><rect x="610" y="200" width="255" height="140" rx="10" fill="#ffffff" stroke="#94a3b8"/></g>
    <text x="625" y="225" font-size="15" font-weight="700" fill="#0f172a">backup · 2224 (a profile)</text>
    <text x="625" y="247">sshd: AllowUsers ccs-backup,</text>
    <text x="625" y="265">ForceCommand ccs-backup-receive</text>
    <text x="625" y="283">the key's from=: the backend only</text>
    <text x="625" y="301">keeps every version, deletes none</text>
    <text x="625" y="319" fill="#b45309" font-weight="600">in production: its own machine</text>

    <g filter="url(#sh)"><rect x="610" y="355" width="255" height="60" rx="10" fill="#ffffff" stroke="#94a3b8"/></g>
    <text x="625" y="378" font-size="14" font-weight="700" fill="#0f172a">heartbeat</text>
    <text x="625" y="398">ccs-data, no capabilities: no pushes?</text>

    <rect x="335" y="355" width="240" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="350" y="377" font-size="13" font-weight="700" fill="#0f172a">Every container</text>
    <text x="350" y="397">read-only, no-new-privileges</text>
    <text x="350" y="415">sshd: SETUID, SETGID, SYS_CHROOT</text>
    <text x="350" y="433">QR codes: libzbar on decoded pixels</text>
    <text x="350" y="451">sshd: journald; the gate: a log file</text>

    <text x="625" y="440" font-size="11.5" fill="#475569">init, once: its own host key,</text>
    <text x="625" y="456" font-size="11.5" fill="#475569">passwd from the host's ids</text>
  </g>

  <!-- the host's -->
  <rect x="320" y="500" width="260" height="160" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
  <text x="335" y="524" font-size="14" font-weight="700" fill="#9a3412">On the host, unchanged</text>
  <g font-size="12" fill="#334155">
    <text x="335" y="546">nginx: serves /var/lib/ccs-data</text>
    <text x="335" y="564">(80, 443; its headers, the theme lines)</text>
    <text x="335" y="582">/etc/ccs-gate: the list, the design</text>
    <text x="335" y="600">/etc/ssh/authorized_keys: the key files</text>
    <text x="335" y="618">(root's, with from= and command=)</text>
    <text x="335" y="636">the accounts' ids, the folders</text>
  </g>
  <rect x="600" y="500" width="280" height="160" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="615" y="524" font-size="14" font-weight="700" fill="#14532d">/var/lib/ccs-data</text>
  <g font-size="12" fill="#166534">
    <text x="615" y="546">the live site: written only by the gate,</text>
    <text x="615" y="564">a page only once it passed every check;</text>
    <text x="615" y="582">a page that fails keeps its last good copy</text>
    <text x="615" y="600">and IRC is told</text>
  </g>

  <!-- outside -->
  <g font-size="12" fill="#334155">
    <g filter="url(#sh)"><rect x="935" y="190" width="240" height="60" rx="10" fill="#ffffff" stroke="#94a3b8"/></g>
    <text x="950" y="215" font-size="14" font-weight="700" fill="#0f172a">GitLab / Forgejo</text>
    <text x="950" y="235">the proposals (the gate's own fetch)</text>
    <g filter="url(#sh)"><rect x="935" y="360" width="240" height="60" rx="10" fill="#ffffff" stroke="#94a3b8"/></g>
    <text x="950" y="385" font-size="14" font-weight="700" fill="#0f172a">IRC (alerts)</text>
    <text x="950" y="405">a page held back; no pushes</text>
    <g filter="url(#sh)"><rect x="935" y="545" width="240" height="60" rx="10" fill="#ffffff" stroke="#94a3b8"/></g>
    <text x="950" y="570" font-size="14" font-weight="700" fill="#0f172a">Visitors</text>
    <text x="950" y="590">browsers, over HTTPS</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke-width="2.2">
    <path d="M230,215 H335" stroke="#d97706" marker-end="url(#o)"/>
    <path d="M230,310 H270 V290 H610" stroke="#d97706" marker-end="url(#o)"/>
    <path d="M582,340 V488 H740 V500" stroke="#16a34a" marker-end="url(#g)"/>
    <path d="M600,580 H580" stroke="#16a34a" marker-end="url(#g)"/>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#s)">
    <path d="M595,215 H602 V158 H915 V220 H935"/>
    <path d="M865,385 H935"/>
    <path d="M450,660 V676 H915 V575 H935"/>
  </g>
  <text x="240" y="207" font-size="11" fill="#9a3412">:2223</text>
  <text x="240" y="303" font-size="11" fill="#9a3412">:2224</text>
  <text x="920" y="185" font-size="11" fill="#475569">fetch</text>
  <text x="878" y="378" font-size="11" fill="#475569">alerts</text>
  <text x="700" y="671" font-size="11" fill="#475569">nginx serves it</text>
  <text x="592" y="430" font-size="11" fill="#166534" transform="rotate(90 592 430)">writes</text>
</svg>
